<nav class="nav" aria-label="Primary">
  <p class="nav-label">Navigation</p>
  <ul class="nav-links">
    {% for item in site.data.navigation %}
    <li>
      {% if page.url == item.link %}
      <span class="nav-current" aria-current="page">{{ item.name }}</span>
      {% else %}
      <a href="{{ item.link }}">{{ item.name }}</a>
      {% endif %}
    </li>
    {% endfor %}
  </ul>
</nav>
